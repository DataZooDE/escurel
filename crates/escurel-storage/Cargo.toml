[package]
name = "escurel-storage"
description = "Object storage abstraction for Escurel: LaneStore trait + filesystem impl."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
# S3-backed LaneStore. Gated behind a feature so the dev/test default
# (`FsStore`) need not pull the AWS SDK + its transitive deps. The
# substrate deployment target builds with `--features s3`.
s3 = ["dep:aws-config", "dep:aws-sdk-s3", "dep:aws-credential-types"]
# GCS-backed LaneStore. Same rationale as `s3`: the official Google client
# and its auth stack are a heavy dependency the fs default should not pay.
# Credentials are Application Default Credentials — the metadata server on
# GCP, or GOOGLE_APPLICATION_CREDENTIALS pointing at a key file off it.
gcs = ["dep:google-cloud-storage", "dep:google-cloud-gax", "dep:google-cloud-auth", "dep:serde_json"]
# LaneStore over DuckDB's virtual filesystem. One backend for every scheme
# DuckDB can reach — `gdrive://` (the reason it exists), plus `s3://`,
# `gs://`, `hf://` and plain local paths — because the dispatch happens
# inside DuckDB, not here. See `duckvfs.rs` for what it needs from the
# duckdb-gdrive extension.
duckvfs = ["dep:duckdb"]

[dependencies]
async-trait = "0.1"
bytes = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "rt"] }
url = "2"
walkdir = "2"

# S3 backend (feature `s3`). The official AWS SDK speaks plain S3 and
# works against MinIO / Hetzner Object Storage via a custom endpoint
# URL + path-style addressing.
aws-config = { version = "1", optional = true }
aws-sdk-s3 = { version = "1", optional = true }
aws-credential-types = { version = "1", optional = true }
google-cloud-storage = { version = "1.16.0", optional = true }
google-cloud-gax = { version = "1.12.0", optional = true }
google-cloud-auth = { version = "1.14.0", optional = true }
serde_json = { version = "1.0.151", optional = true }
# DuckDB VFS backend (feature `duckvfs`). Same pinned build as
# escurel-index — see that crate's note on DUCKDB_DOWNLOAD_LIB.
duckdb = { version = "1", default-features = false, optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# Real MinIO container for the S3 integration test (feature `s3`).
testcontainers-modules = { version = "0.15", features = ["minio"] }

[lints]
workspace = true
