[package]
name = "escurel-types"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
# Pack manifest signing/verification (`pack` module): HMAC-SHA256 over
# the canonical manifest JSON + SHA-256 over the tarball bytes. These
# live here (next to `PackManifest`) so BOTH the server and the CLI's
# offline `pack verify` share one implementation without the CLI
# depending on escurel-server.
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
# Page frontmatter keeps the order it was written in, however this crate is built.
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
# Cron schedules declared in skill frontmatter (`schedule` module): parsed by
# the indexer's validator AND the runner's schedule loop, so both share one
# grammar. Optional so wire-only consumers (the client) don't pay for tzdata.
croner = { version = "4", optional = true }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"], optional = true }
chrono-tz = { version = "0.10", optional = true }
# Credential shapes (`redact` module): the pack gate, the gateway's tool-call
# summaries and the runner's run transcript share one scrubber.
regex = { version = "1", optional = true }

[features]
schedule = ["dep:croner", "dep:chrono", "dep:chrono-tz"]
redact = ["dep:regex"]
