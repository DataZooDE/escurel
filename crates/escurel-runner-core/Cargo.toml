[package]
name = "escurel-runner-core"
description = "Harness-agnostic engine for the escurel agent runner: config, trigger lifecycle, dispatch queue, loop control."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
# Minting the runner's own gateway bearer (see src/auth.rs). Same claim shape
# and same `kid` scheme as the platform's other workloads, because this
# borrows that signing identity rather than becoming a second issuer.
base64 = "0.22"
escurel-client = { path = "../escurel-client" }
jsonwebtoken = "9"
escurel-runner-workflow = { path = "../escurel-runner-workflow" }
escurel-types = { path = "../escurel-types" }
rsa = { version = "0.9", features = ["pem"] }
rusqlite = { version = "0.37", features = ["bundled"] }
secrecy = "0.10"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["sync", "time"] }
tracing = "0.1"
ulid = "1"

[dev-dependencies]
rand = "0.8"
tempfile = "3"

[lints]
workspace = true
