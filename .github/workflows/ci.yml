name: CI

# Re-enabled at v1.0.0 (M6). During bootstrap CI was paused
# (`workflow_dispatch` only) and the local four-command gate
# (`cargo fmt` / `clippy -D warnings` / `test` / `build --release`)
# was the merge gate per CLAUDE.md "How we work". With the workspace
# stabilised at v1 the GitHub Actions safety net is back on for
# every push to main and every PR.
#
# This is the correctness gate: fmt + clippy + test + build on Linux, on
# every PR, every push to main, and every release tag. The cross-platform
# RELEASE binaries (Windows + macOS + Linux packaging + GitHub Release)
# live in `release.yml`, which fires on `v*` tags only — PRs stay
# Linux-only.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: short
  # The workspace statically links libduckdb into ~15 test
  # binaries. Linking them with full debuginfo, in parallel, blows
  # past the 7 GB on a GitHub-hosted runner — the first re-enabled
  # CI run got SIGTERM'd (exit 143) mid-link before any test ran.
  # Drop test/dev debuginfo (duckdb's is enormous) and serialise
  # build jobs to cap peak link memory. CI-only; the committed
  # profiles and local dev builds are untouched.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_BUILD_JOBS: "1"

jobs:
  # The four gates run as SEPARATE jobs, each on its own runner.
  #
  # They used to be four steps in one job, which meant one `target/`
  # holding check, test AND release artifacts for a workspace that
  # statically links libduckdb — already close enough to a hosted
  # runner's limits that this file carries `CARGO_BUILD_JOBS=1` and
  # `*_DEBUG=0` to survive. Adding the s3/gcs SDK trees tipped it over:
  # runs died mid-step with exit 143 and with "the operation was
  # canceled".
  #
  # That failure mode is self-sustaining, which is the real reason to
  # split: a cancelled job SKIPS the cache-save step, so a run that dies
  # leaves no warm cache, and the next run starts cold and dies in the
  # same place. Separate runners give each gate its own memory, disk and
  # cache key, so one slow gate cannot starve the others or poison the
  # cache for all of them.

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-lint
          cache-directories: target/duckdb-download
          cache-on-failure: true

      - name: Ensure libduckdb is present (cache-restore safety)
        run: |
          if ! ls target/duckdb-download/*/*/libduckdb.so >/dev/null 2>&1; then
            echo "libduckdb not in restored cache — forcing libduckdb-sys rebuild"
            cargo clean -p libduckdb-sys || true
          fi
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-test
          cache-directories: target/duckdb-download
          cache-on-failure: true

      - name: Ensure libduckdb is present (cache-restore safety)
        run: |
          if ! ls target/duckdb-download/*/*/libduckdb.so >/dev/null 2>&1; then
            echo "libduckdb not in restored cache — forcing libduckdb-sys rebuild"
            cargo clean -p libduckdb-sys || true
          fi
      - name: cargo test
        run: cargo test --workspace --all-targets

  build:
    name: build --release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-build
          cache-directories: target/duckdb-download
          cache-on-failure: true

      - name: Ensure libduckdb is present (cache-restore safety)
        run: |
          if ! ls target/duckdb-download/*/*/libduckdb.so >/dev/null 2>&1; then
            echo "libduckdb not in restored cache — forcing libduckdb-sys rebuild"
            cargo clean -p libduckdb-sys || true
          fi
      - name: cargo build --release
        run: cargo build --workspace --release

  # The SHIPPED feature set.
  #
  # Without this, `s3.rs` and `gcs.rs` are never compiled on the merge
  # path — they sit behind optional features and no other job passes
  # `--features`. That is how the S3 backend reached production
  # unbuildable: the Dockerfile selected a feature CI had never once
  # compiled.
  #
  # clippy without `--all-targets`: the backends' own integration tests
  # need real containers and run in `live.yml`. This job proves the
  # library code compiles and lints under the flags the release
  # artifacts actually use.
  features:
    name: clippy (shipped features)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-features-s3-gcs
          cache-directories: target/duckdb-download
          cache-on-failure: true

      - name: Ensure libduckdb is present (cache-restore safety)
        run: |
          if ! ls target/duckdb-download/*/*/libduckdb.so >/dev/null 2>&1; then
            echo "libduckdb not in restored cache — forcing libduckdb-sys rebuild"
            cargo clean -p libduckdb-sys || true
          fi
      - name: cargo clippy --features s3,gcs
        run: cargo clippy -p escurel-server -p escurel-storage --features s3,gcs -- -D warnings
