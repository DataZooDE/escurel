# vscode.yml — the escurel VS Code extension (editors/vscode)
#
# Independent of the Rust ci.yml and scoped via `paths:` so a change outside
# editors/vscode/ never sets up Node. Every push and PR touching the
# extension: typecheck, lint (incl. the no-literal-colours check on
# webview/), unit + component tests, build, Playwright visual checks in
# light / dark / high-contrast, a VSIX artifact, and the Evolve extension-host
# review path against the verifying gateway and real runner.

name: vscode

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'editors/vscode/**'
      - 'crates/escurel-server/**'
      - 'crates/escurel-runner/**'
      - 'crates/escurel-test-support/**'
      - 'crates/escurel-index/**'
      - 'crates/escurel-types/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/vscode.yml'
  pull_request:
    paths:
      - 'editors/vscode/**'
      - 'crates/escurel-server/**'
      - 'crates/escurel-runner/**'
      - 'crates/escurel-test-support/**'
      - 'crates/escurel-index/**'
      - 'crates/escurel-types/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/vscode.yml'

concurrency:
  group: vscode-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evolve-extension-host:
    name: Evolve plan review in VS Code host
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      ESCUREL_REQUIRE_CASCADE: "1"
      ESCUREL_TEST_GREP: Evolve problem plan review
      ESCUREL_SERVER_BIN: ${{ github.workspace }}/target/debug/escurel-server
      ESCUREL_RUNNER_BIN: ${{ github.workspace }}/target/debug/escurel-runner
      ESCUREL_TEST_GATEWAY_BIN: ${{ github.workspace }}/target/debug/escurel-test-gateway
      LD_LIBRARY_PATH: ${{ github.workspace }}/target/debug/deps
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: vscode-evolve-host
          cache-directories: target/duckdb-download
          cache-on-failure: true
      - name: Ensure libduckdb is present
        run: |
          if ! ls target/duckdb-download/*/*/libduckdb.so >/dev/null 2>&1; then
            cargo clean -p libduckdb-sys || true
          fi
      - name: Build real gateway and runner
        run: cargo build -p escurel-server -p escurel-runner -p escurel-test-support --bin escurel-server --bin escurel-runner --bin escurel-echo-harness --bin escurel-test-gateway
      - uses: actions/setup-node@v4
        with:
          node-version-file: editors/vscode/.nvmrc
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
        working-directory: editors/vscode
      - name: Install VS Code host dependencies
        run: npx playwright install --with-deps chromium
        working-directory: editors/vscode
      - name: Verify Evolve preflight and plan review in VS Code host
        run: npm run test:integration
        working-directory: editors/vscode
      - name: Install native dialog test support
        run: sudo apt-get install -y python3-xlib python3-pil
      - name: Verify Evolve approval in a real VS Code window
        env:
          ESCUREL_BIN_DIR: ${{ github.workspace }}/target/debug
          ESCUREL_DEMO_CODE: ${{ github.workspace }}/editors/vscode/.vscode-test/vscode-linux-x64-1.139.1/code
        run: npm run test:e2e -- evolve.spec.ts
        working-directory: editors/vscode
      - name: Show Evolve runner diagnostics on failure
        if: failure()
        run: |
          for log in /tmp/escurel-vsx-runner-*/runner.log; do
            if [ -f "$log" ]; then
              echo "Runner log: $log"
              tail -120 "$log"
            fi
          done

  build-test-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: editors/vscode

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: editors/vscode/.nvmrc
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - run: npm ci

      - name: playwright browsers (component tests)
        run: npx playwright install --with-deps chromium

      # typecheck + lint + unit + component tests: the same `npm test` the
      # local pre-push hook runs (scripts/check.sh vscode, which adds npm ci).
      - run: npm test
      - run: npm run build
      # Inside the pinned Playwright image, like the committed baselines.
      - run: npm run test:visual

      - name: package VSIX
        run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: escurel-vsix
          path: editors/vscode/*.vsix
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: editors/vscode/playwright-report
          if-no-files-found: ignore

      - name: Summary
        run: |
          {
            echo "## escurel VS Code extension"
            echo ""
            echo "VSIX: \`$(ls *.vsix)\`"
          } >> "$GITHUB_STEP_SUMMARY"
