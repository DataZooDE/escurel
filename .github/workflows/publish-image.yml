name: publish-image

# Build the escurel-server container and publish it to the org GHCR registry
# so the DataZoo Kamal substrate can deploy it (ADR-0013: "apps push their
# images to the central registry"; the substrate pulls ghcr.io/datazoode/escurel
# with a read token and `kamal deploy --skip-push`). Tags pushed on main: :main (moving)
# and :<12-char-sha> (immutable, what a substrate PR pins). A release-branch
# dispatch publishes only its requested extra_tag, leaving :main untouched.
# On a `v*` release tag the
# image is published as :<tag> and :<12-char-sha> instead (no moving :main from a tag),
# and the server image is built with REQUIRE_GDRIVE=1: a release image must carry the
# gdrive extension (WIF-capable build from the erpl mirror), so a missing mirror
# artifact FAILS the release instead of silently dropping it (main builds keep the
# loud-warning behaviour). `paths` filters do not apply to tag pushes.
on:
  workflow_dispatch:
    inputs:
      extra_tag:
        description: "Immutable escurel tag for a release-branch dispatch (e.g. 867d0787ba18-opt1)"
        required: false
        default: ""
  push:
    branches: [main]
    tags: ["v*"]
    # Only rebuild the image when something that affects the binary changes.
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "Dockerfile"
      - "Dockerfile.runner"
      - ".github/workflows/publish-image.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: build + push escurel-server → ghcr
    runs-on: ubuntu-latest
    # Cold bundled-DuckDB compile + thin-LTO release link is slow (~15-25 min);
    # give generous headroom.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: tags
        env:
          EXTRA_TAG: ${{ inputs.extra_tag }}
        run: |
          set -euo pipefail
          SHA="$(echo "${{ github.sha }}" | cut -c1-12)"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.ref }}" != "refs/heads/main" ]]; then
            [[ "$EXTRA_TAG" =~ ^[0-9a-f]{12}-opt[1-9][0-9]*$ ]] || { echo "Release-branch dispatch requires a <12-char-main-sha>-optN extra_tag" >&2; exit 1; }
            TAGS="ghcr.io/datazoode/escurel:${EXTRA_TAG}"
            echo "require_gdrive=0" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAGS="ghcr.io/datazoode/escurel:${{ github.ref_name }},ghcr.io/datazoode/escurel:${SHA}"
            echo "require_gdrive=1" >> "$GITHUB_OUTPUT"
          else
            TAGS="ghcr.io/datazoode/escurel:main,ghcr.io/datazoode/escurel:${SHA}"
            echo "require_gdrive=0" >> "$GITHUB_OUTPUT"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "::notice title=Publish::${TAGS}"

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # A release tag must ship gdrive (see the header): fail the build if the mirror lacks it.
          build-args: |
            REQUIRE_GDRIVE=${{ steps.tags.outputs.require_gdrive }}
          # Scoped. Both this workflow and the other image build in this repo
          # used a bare `type=gha`, which is ONE shared scope — the Rust gateway image
          # and the other were overwriting each other's layer cache, so
          # whichever ran last left the other cold. Distinct scopes give each
          # image its own.
          cache-from: type=gha,scope=escurel-server
          cache-to: type=gha,mode=max,scope=escurel-server
          provenance: false

  publish-runner:
    name: build + push escurel-runner → ghcr
    # Release-branch dispatches must not move the runner's :main tag.
    if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    # Runner release build links libduckdb dynamically (DuckDB-backed ledger);
    # runtime stage packages libduckdb.so and libstdc++6.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags (:main or :<tag>, plus :<sha>)
        id: tags
        run: |
          set -euo pipefail
          SHA="$(echo "${{ github.sha }}" | cut -c1-12)"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then FIRST="${{ github.ref_name }}"; else FIRST="main"; fi
          echo "tags=ghcr.io/datazoode/escurel-runner:${FIRST},ghcr.io/datazoode/escurel-runner:${SHA}" >> "$GITHUB_OUTPUT"
          echo "::notice title=Publish::ghcr.io/datazoode/escurel-runner :${FIRST} + :${SHA}"

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runner
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # Its own cache scope, for the reason spelled out above: a shared
          # scope means whichever image builds last leaves the other cold.
          cache-from: type=gha,scope=escurel-runner
          cache-to: type=gha,mode=max,scope=escurel-runner
          provenance: false
