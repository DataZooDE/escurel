name: publish-image

# Build the escurel-server container and publish it to the org GHCR registry
# so the DataZoo Kamal substrate can deploy it (ADR-0013: "apps push their
# images to the central registry"; the substrate pulls ghcr.io/datazoode/escurel
# with a read token and `kamal deploy --skip-push`). Tags pushed on main: :main (moving)
# and :<12-char-sha> (immutable, what a substrate PR pins). On a `v*` release tag the
# image is published as :<tag> and :<12-char-sha> instead (no moving :main from a tag),
# and the server image is built with REQUIRE_GDRIVE=1: a release image must carry the
# gdrive extension (WIF-capable build from the erpl mirror), so a missing mirror
# artifact FAILS the release instead of silently dropping it (main builds keep the
# loud-warning behaviour). `paths` filters do not apply to tag pushes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    # Only rebuild the image when something that affects the binary changes.
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "Dockerfile"
      - "Dockerfile.runner"
      - ".github/workflows/publish-image.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: build + push escurel-server → ghcr
    runs-on: ubuntu-latest
    # Cold bundled-DuckDB compile + thin-LTO release link is slow (~15-25 min);
    # give generous headroom.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Image tags (:main or :<tag>, plus :<sha>)
        id: tags
        # The tag name is attacker-chosen and this job holds `packages: write`: it reaches the shell only through
        # env, and scripts/image-tags.sh validates it (release-version.sh) before anything uses it.
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          GIT_SHA: ${{ github.sha }}
        run: scripts/image-tags.sh ghcr.io/datazoode/escurel >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # A release tag must ship gdrive (see the header): fail the build if the mirror lacks it.
          build-args: |
            REQUIRE_GDRIVE=${{ steps.tags.outputs.require_gdrive }}
          # Scoped. Both this workflow and the other image build in this repo
          # used a bare `type=gha`, which is ONE shared scope — the Rust gateway image
          # and the other were overwriting each other's layer cache, so
          # whichever ran last left the other cold. Distinct scopes give each
          # image its own.
          cache-from: type=gha,scope=escurel-server
          cache-to: type=gha,mode=max,scope=escurel-server
          provenance: false

  publish-runner:
    name: build + push escurel-runner → ghcr
    runs-on: ubuntu-latest
    # Runner release build links libduckdb dynamically (DuckDB-backed ledger);
    # runtime stage packages libduckdb.so and libstdc++6.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Image tags (:main or :<tag>, plus :<sha>)
        id: tags
        # The tag name is attacker-chosen and this job holds `packages: write`: it reaches the shell only through
        # env, and scripts/image-tags.sh validates it (release-version.sh) before anything uses it.
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          GIT_SHA: ${{ github.sha }}
        run: scripts/image-tags.sh ghcr.io/datazoode/escurel-runner >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runner
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # Its own cache scope, for the reason spelled out above: a shared
          # scope means whichever image builds last leaves the other cold.
          cache-from: type=gha,scope=escurel-runner
          cache-to: type=gha,mode=max,scope=escurel-runner
          provenance: false
