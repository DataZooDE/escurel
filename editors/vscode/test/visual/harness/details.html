<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>escurel details view visual harness</title>
    <script>
      const theme = new URLSearchParams(location.search).get('theme') ?? 'dark';
      document.write(`<link rel="stylesheet" href="../tokens/${theme}.css" />`);
      document.documentElement.dataset.theme = theme;
    </script>
    <style>
      body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: var(--vscode-editor-background);
        color: var(--vscode-foreground);
        font-family: var(--vscode-font-family);
      }
      escurel-details {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <escurel-details></escurel-details>
    <script type="module" src="../../../dist/test/visual/details-harness.js"></script>
