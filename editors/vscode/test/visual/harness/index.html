<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>escurel visual harness</title>
    <!-- The theme sheet is chosen by ?theme=light|dark|high-contrast; it only
         defines --vscode-* tokens, exactly what VS Code injects into a webview. -->
    <script>
      const theme = new URLSearchParams(location.search).get('theme') ?? 'dark';
      document.write(`<link rel="stylesheet" href="../tokens/${theme}.css" />`);
      document.documentElement.dataset.theme = theme;
    </script>
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: var(--vscode-editor-background);
        color: var(--vscode-foreground);
        font-family: var(--vscode-font-family);
      }
    </style>
  </head>
  <body>
    <escurel-page-as-ui></escurel-page-as-ui>
    <script type="module" src="../../../dist/webview/page-as-ui.js"></script>
  </body>
</html>
